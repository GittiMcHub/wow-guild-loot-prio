name: quality
# The security analyst agent does NOT run scans. Scanners are deterministic,
# free, and better at finding things than an LLM; the agent's value is triage.
# These jobs produce the artifacts it reads.
#
# Add `test` and `security` as required status checks on main once this file
# has run at least once (GitHub only offers checks it has seen).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # --- adapt this block to the project's stack -------------------------
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      # ---------------------------------------------------------------------

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # gitleaks needs full history

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default

      - name: trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
